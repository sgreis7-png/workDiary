name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20. On Node 20 @supabase/supabase-js refuses to load at all — "Node.js 20
          # detected without native WebSocket support" — so five test files could not even be
          # imported. `npm test` had also never been given the Supabase env vars the client needs
          # at import time, which is why the suite passed on a developer's machine (where .env
          # exists) and failed here. That part is fixed in vitest.config.ts instead, so it cannot
          # depend on this file again.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # tsc runs with strict + noUnusedLocals, so dead code fails the build
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
      - run: npm test
